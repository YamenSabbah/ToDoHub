<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../assets/css/index.css">
    <link rel="stylesheet" href="../assets/css/dashboard.css">
    <title>Dashboard — ToDo Hub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="icon" type="image/icon" href="../assets/images/Task.ico">
</head>

<body>
    <nav class="navbar navbar-expand-lg site-navbar">
        <div class="container d-flex justify-content-between align-items-center">
            <a class="navbar-brand d-flex align-items-center gap-2 text-decoration-none">
                <img src="../assets/images/Task.ico" alt="ToDo Hub" class="navbar-icon" width="32" height="32">
                <span class="brand-text text-white">ToDo<span class="gradient-text">Hub</span></span>
            </a>
            <div class="d-flex flex-column flex-sm-row align-items-center  gap-3">
                <span class="fw-bold text-white  ">Yamen Sabbah</span>
                <button type="submit" id="logoutBtn"
                    class="btn btn-outline-info btn-sm px-3 py-1 rounded-3 text-decoration-none fw-bold">Logout</a>
            </div>
        </div>
    </nav>

    <section class="dashboard">
        <div class="hero-particles" id="particles"></div>

        <div class="container py-5 mt-4">
            <div class="d-flex flex-column flex-md-row text-center justify-content-between align-items-center mb-4">
                <div>
                    <h1 class="text-white fw-bold mb-1">My Tasks</h1>
                    <p class="text-white-50 mb-0">Manage your tasks and stay productive.</p>
                </div>
                <button class="btn btn-primary-custom fw-bold text-white px-4 m-3 m-md-0 py-2 rounded-3"
                    data-bs-toggle="modal" data-bs-target="#addTaskModal">+ Add Task</button>
            </div>

            <div id="taskBoard" class="d-flex flex-column gap-4">

            </div>
        </div>
    </section>

    <div class="modal fade" id="addTaskModal" tabindex="-1" aria-labelledby="addTaskModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content bg-transparent border-0">
                <div class="modal-header border-0 pb-0">
                    <h5 class="modal-title text-white fw-bold" id="addTaskModalLabel">New Task</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"
                        aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="addTaskForm" class="d-flex flex-column gap-3">
                        <div>
                            <label for="taskName" class="form-label text-white-50">Task name</label>
                            <input type="text" class="form-control auth-input px-3 py-2 rounded-3 fs-6" id="taskName"
                                name="name" placeholder="e.g. Do Homework" required>
                        </div>
                        <div>
                            <label for="taskDesc" class="form-label text-white-50">Description</label>
                            <textarea class="form-control auth-input px-3 py-2 rounded-3 fs-6" id="taskDesc"
                                name="description" placeholder="Brief description of the task..." rows="3"
                                required></textarea>
                        </div>
                        <div>
                            <label for="taskDay" class="form-label text-white-50">Day</label>
                            <select class="form-select auth-input px-3 py-2 rounded-3 fs-6" id="taskDay" name="day"
                                required></select>
                        </div>
                        <button type="submit"
                            class="btn btn-primary-custom fw-bold text-white w-100 py-2 mt-1 rounded-3">Add
                            Task</button>
                    </form>
                </div>
            </div>
        </div>
    </div>


    <script src="../assets/js/index.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script>checkAuth();</script>
    <script src="../assets/js/dashboard.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script>
        document.getElementById("logoutBtn").addEventListener("click", () => {
            fetch('http://localhost:4000/graphql', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                credentials: 'include',
                body: JSON.stringify({
                    query: `mutation { logout }`
                })
            }).then(() => {
                window.location.href = 'index.html';
            });
        })


    </script>
</body>

</html>
