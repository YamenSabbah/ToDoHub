<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../assets/css/index.css">
    <link rel="stylesheet" href="../assets/css/auth.css">
    <title>Register — ToDo Hub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="icon" type="image/icon" href="../assets/images/Task.ico">
</head>

<body>
    <nav
        class="navbar navbar-expand-lg site-navbar position-absolute top-0 start-0 end-0 py-3 border-bottom border-light border-opacity-10 z-3">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2 text-decoration-none" href="index.html">
                <img src="../assets/images/Task.ico" alt="ToDo Hub" class="navbar-icon" width="32" height="32">
                <span class="brand-text text-white">ToDo<span class="gradient-text">Hub</span></span>
            </a>
        </div>
    </nav>

    <section class="auth-page position-relative min-vh-100 d-flex align-items-center overflow-hidden mt-lg-5">
        <div class="hero-particles position-absolute top-0 start-0 w-100 h-100 pe-none opacity-35 z-1" id="particles">
        </div>

        <div class="container py-5 mt-5 mt-lg-0">
            <div class="row justify-content-center">
                <div class="col-12 col-sm-10 col-md-7 col-lg-5">
                    <div class="auth-card position-relative z-2 p-4 p-sm-5 rounded-4 shadow">
                        <div class="text-center mb-4">
                            <h2 class="auth-title fw-bold text-white mb-2">Create your account</h2>
                            <p class="text-white-50 small mb-0">Start organizing your tasks today.</p>
                        </div>

                        <form action="/auth/register" method="POST" class="d-flex flex-column gap-3">
                            <div class="form-group">
                                <label for="name" class="form-label">Full name</label>
                                <input type="text" class="form-control auth-input px-3 py-2 rounded-3 fs-6" id="name"
                                    name="name" placeholder="Name" required>
                            </div>

                            <div class="form-group">
                                <label for="email" class="form-label">Email address</label>
                                <input type="email" class="form-control auth-input px-3 py-2 rounded-3 fs-6" id="email"
                                    name="email" placeholder="you@gmail.com" required
                                    pattern="[a-zA-Z0-9._%+-]+@gmail\.com" oninput="validateGmail(this)">
                                <small class="email-error text-danger d-none">Please use a valid @gmail.com
                                    address</small>
                            </div>

                            <div class="form-group">
                                <label for="password" class="form-label">Password</label>
                                <input type="password" class="form-control auth-input px-3 py-2 rounded-3 fs-6"
                                    id="password" name="password" placeholder="••••••••" required minlength="6">
                            </div>




                            <button type="submit"
                                class="btn btn-primary-custom fw-bold text-white w-100 py-2 mt-2 rounded-3">
                                Create Account
                            </button>
                        </form>

                        <div class="auth-divider d-flex align-items-center text-center my-3"><span>or</span></div>



                        <p class="text-center text-white-50 mt-4 mb-0 small">
                            Already have an account?
                            <a href="login.html" class="auth-link fw-semibold text-decoration-none">Log in</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <script src="../assets/js/index.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script>
        function validateGmail(input) {
            const error = document.querySelector('.email-error');
            const valid = /^[a-zA-Z0-9._%+-]+@gmail\.com$/.test(input.value);
            if (input.value.length > 0 && !valid) {
                error.classList.remove('d-none');
                input.classList.add('is-invalid');
                input.classList.remove('is-valid');
            } else if (input.value.length > 0 && valid) {
                error.classList.add('d-none');
                input.classList.add('is-valid');
                input.classList.remove('is-invalid');
            } else {
                error.classList.add('d-none');
                input.classList.remove('is-invalid', 'is-valid');
            }
        }

        document.querySelector('form').addEventListener('submit', function (e) {
            const email = document.getElementById('email');
            const valid = /^[a-zA-Z0-9._%+-]+@gmail\.com$/.test(email.value);
            if (!valid) {
                e.preventDefault();
                validateGmail(email);
                email.focus();
            }
        });
    </script>
</body>

</html>
